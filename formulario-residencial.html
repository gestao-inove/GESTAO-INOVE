<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotação de Seguro Residencial · Inove</title>
<style>
  :root{--navy:#001C4E;--gold:#C9A227;--goldDeep:#96791C;--ink:#101B33;--inkSoft:#5B6478;--line:#E2E5EC;--bg:#F4F6F9;--green:#128C4B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:18px}
  .topo{background:var(--navy);border-radius:16px 16px 0 0;padding:22px 22px 18px;text-align:center}
  .topo .nome{color:#fff;font-size:26px;font-weight:800;letter-spacing:1.5px}
  .topo .tag{color:#9FB0CC;font-size:10.5px;letter-spacing:.4px;margin-top:4px}
  .topo .chamada{color:#fff;font-size:15px;font-weight:700;margin-top:14px}
  .topo .sub{color:#C9D6E8;font-size:12px;margin-top:4px;line-height:1.4}
  .card{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:20px;box-shadow:0 4px 20px rgba(16,27,51,.06)}
  .secao{font-size:11px;font-weight:800;color:var(--goldDeep);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .secao:first-child{margin-top:0}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--inkSoft);margin:14px 0 5px}
  label .req{color:#B0413E}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:-1px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:11px;color:var(--inkSoft);margin-top:5px;line-height:1.5}
  .btn{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}
  .btn:active{opacity:.9}
  .aviso{font-size:11px;color:var(--inkSoft);text-align:center;margin-top:14px;line-height:1.5}
  .erro{color:#B0413E;font-size:12px;font-weight:600;margin-top:10px;text-align:center;min-height:16px}
  @media(max-width:420px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo">
    <div class="nome">INOVE</div>
    <div class="tag">SEGUROS E SOLUÇÕES FINANCEIRAS · CERTIFICAÇÃO DIGITAL</div>
    <div class="chamada">Cotação de Seguro Residencial</div>
    <div class="sub">Preencha os dados do seu imóvel pra gente montar sua cotação. 🏠</div>
  </div>
  <div class="card">
    <div class="secao">Dados do imóvel</div>
    <div class="row2">
      <div>
        <label>CPF <span class="req">*</span></label>
        <input id="cpf" inputmode="numeric" placeholder="Só números">
      </div>
      <div>
        <label>CEP</label>
        <input id="cep" inputmode="numeric" placeholder="Só números">
      </div>
    </div>
    <label>Tipo de imóvel</label>
    <select id="tipo">
      <option value="">Selecione...</option>
      <option>Casa</option>
      <option>Casa em condomínio fechado</option>
      <option>Apartamento</option>
    </select>

    <label>Valor do risco declarado (R$)</label>
    <input id="valor" inputmode="decimal" placeholder="Ex: 350.000,00">
    <div class="hint">(valor de avaliação do seu imóvel)</div>

    <label>Observações (opcional)</label>
    <input id="obs" placeholder="Algo que queira nos contar">

    <button class="btn" onclick="enviar()">Enviar pelo WhatsApp</button>
    <div class="erro" id="erro"></div>
    <div class="aviso">Ao enviar, o WhatsApp abre com seus dados preenchidos — é só apertar em enviar. 😊</div>
  </div>
</div>
<script>
var WHATSAPP = "5519997639554";
// ---- Integração com o painel da corretora ----
var API_INOVE = "https://gestao-inove.onrender.com";
var FORM_KEY = "inove-form-2026";
// O servidor grátis "dorme" por inatividade: acorda ele assim que a página abre
try{ fetch(API_INOVE + "/").catch(function(){}); }catch(e){}
// Abre o atendimento no painel. Se falhar, NÃO atrapalha o envio pelo WhatsApp.
function registrarNoPainel(subtipo, cpf, notas){
  try{
    fetch(API_INOVE + "/api/formulario", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chave: FORM_KEY, subtipo: subtipo, documento: cpf, notas: notas }),
      keepalive: true
    }).catch(function(){});
  }catch(e){}
}
function el(id){return document.getElementById(id)}
function v(id){var e=el(id);return e?(e.value||"").trim():""}
function linha(rot,val){return val?("*"+rot+":* "+val+"\n"):""}
function enviar(){
  var erro=el("erro");erro.textContent="";
  if(!v("cpf")){erro.textContent="Por favor, preencha seu CPF.";el("cpf").focus();return;}
  if(WHATSAPP.indexOf("DDD")>-1||WHATSAPP.indexOf("NUMERO")>-1){erro.textContent="Formulário não configurado com o número da corretora.";return;}
  var msg="Olá! Quero fazer uma cotação de seguro residencial. 🏠\n\n"
    +linha("CPF",v("cpf"))
    +linha("CEP",v("cep"))
    +linha("Tipo de imóvel",v("tipo"))
    +linha("Valor do risco declarado",v("valor"))
    +linha("Observações",v("obs"))
    +"\n_Enviado pelo formulário INOVE_";
  registrarNoPainel("residencial", v("cpf"), msg);
  window.location.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
}
</script>
</body>
</html>
