const STATUSES_CERT = [
  { key: "solicitado", label: "Solicitado", color: COLORS.slate },
  { key: "agendado", label: "Agendado", color: COLORS.camel },

];
function statusesDe(categoria) { return categoria === "certificado" ? STATUSES_CERT : STATUSES; }
// Converte status antigos (do fluxo de seguro) para o fluxo de certificado,
// para que nenhum atendimento já cadastrado suma da tela.
function statusDoItem(a) {
  if (!a) return "";
  if (a.categoria === "certificado") {
    if (a.status === "emitido" || a.status === "finalizado") return "emitido";
    if (a.status === "agendado" || a.status === "aceito") return "agendado";
    return "solicitado";
  }
  // "Proposta finalizada" saiu do quadro: o que estava nela passa a contar como aceito
  if (a.status === "finalizado") return "aceito";
  return a.status;
}
// Etapa em que a venda foi fechada — é quando o cliente entra na Gestão de Clientes
// (certificado: emitido · seguro: cliente aceitou · "finalizado" é o nome antigo)
function concluiuVenda(categoria, status) {
  if (categoria === "certificado") return status === "emitido" || status === "finalizado";
  return status === "aceito" || status === "finalizado";
}
// Etapas em que o atendimento já está concluído (para parar de contar o tempo)
function estaConcluido(a) {
  var st = statusDoItem(a);
  return st === "aceito" || st === "emitido" || st === "recusado";
}
function diasCorridos(dataStr) {
  if (!dataStr) return null;
  var p = String(dataStr).slice(0, 10).split("-");
  if (p.length !== 3) return null;
  var ini = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((hoje - ini) / 86400000));
}
function statusLabel(categoria, key) {
  var s = statusesDe(categoria).find(function (x) { return x.key === key; });
  return s ? s.label : key;
}

function normalizarTelefone(tel) {
  let d = String(tel || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.length <= 11 && !d.startsWith("55")) d = "55" + d; // assume Brasil (DDI 55)
  return d;
}
function getTelefones() {
  try { return JSON.parse(localStorage.getItem("wa_telefones") || "{}"); } catch (e) { return {}; }
}
function chaveTel(nome) { return String(nome || "").trim().toLowerCase(); }
function getTelefone(nome) { return getTelefones()[chaveTel(nome)] || ""; }
function setTelefone(nome, tel) {
  try {
    const m = getTelefones(); const k = chaveTel(nome);
    if (tel) m[k] = tel; else delete m[k];
    localStorage.setItem("wa_telefones", JSON.stringify(m));
  } catch (e) {}
}
function abrirWhatsApp(nome, mensagem) {
  let tel = getTelefone(nome);
  if (!tel) {
    const entrada = window.prompt(`WhatsApp de ${nome || "cliente"} (com DDD, ex: 11 91234-5678):`);
    if (!entrada) return;
    tel = normalizarTelefone(entrada);
    if (!tel) return;
    setTelefone(nome, tel);
  }
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(mensagem || "")}`, "_blank");
}
function addMonths(mk, n) {
  const [y, m] = mk.split("-").map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function monthLabelShort(mk) {
  const [y, m] = mk.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "short", year: "numeric" });
}
function monthLabelLong(mk) {
  const [y, m] = mk.split("-").map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function hojeExtenso() {
  const d = new Date();
  const s = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function parcelaInfo(compra, refMk) {
  const inicio = monthKey(compra.dataCompra);
  const [iy, im] = inicio.split("-").map(Number);
  const [ry, rm] = refMk.split("-").map(Number);
  const offset = (ry - iy) * 12 + (rm - im);
  if (offset < 0 || offset >= compra.parcelas) return null;
  return offset + 1;
}
function proximoVencimento(dataInicioStr, dataVencimentoStr) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  let venc;
  if (dataVencimentoStr) {
    const [vy, vm, vd] = dataVencimentoStr.split("-").map(Number);
    venc = new Date(vy, vm - 1, vd);
  } else {
    const [y, m, d] = dataInicioStr.split("-").map(Number);
    venc = new Date(y + 1, m - 1, d);
  }
  const dias = Math.round((venc - hoje) / 86400000);
  return { venc, dias };
}

function baixarArquivo(nomeArquivo, conteudo, tipo) {
  const blob = new Blob(["﻿" + conteudo], { type: tipo + ";charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function paraCSV(linhas, colunas) {
  const escapar = (v) => {
    if (v == null) return "";
    const s = String(v).replace(/"/g, '""');
    return `"${s}"`;
  };
  const cab = colunas.map((c) => escapar(c.titulo)).join(";");
  const corpo = linhas.map((l) => colunas.map((c) => escapar(c.valor(l))).join(";")).join("\n");
  return cab + "\n" + corpo;
}
function carimboData() {

}

// Token de sessão guardado em memória (não em localStorage, por segurança)
let SESSION_TOKEN = null;
let onSessaoExpirada = null; // callback definido pelo App

function authHeaders(extra) {
  const h = extra || {};
  if (SESSION_TOKEN) h["Authorization"] = "Bearer " + SESSION_TOKEN;
  return h;
}
function tratar401(r) {
  if (r.status === 401) {
    SESSION_TOKEN = null;
    if (onSessaoExpirada) onSessaoExpirada();
    throw new Error("Sessão expirada");
  }
}

async function apiLogin(usuario, senha) {
  const r = await fetch(API_URL + "/api/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ usuario, senha }),
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.error || "Falha no login");
  }
  const d = await r.json();
  SESSION_TOKEN = d.token;
  return d.token;
}

async function apiGet(path) {
  const r = await fetch(API_URL + path, { headers: authHeaders() });
  tratar401(r);
  if (!r.ok) throw new Error("GET " + path);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(API_URL + path, {
    method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body),
  });
  tratar401(r);
  if (!r.ok) throw new Error("POST " + path);
  return r.json();
}
async function apiPatch(path, body) {
  const r = await fetch(API_URL + path, {
    method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body),
  });
  tratar401(r);
  if (!r.ok) throw new Error("PATCH " + path);
  return r.json();
}
async function apiDelete(path) {
  const r = await fetch(API_URL + path, { method: "DELETE", headers: authHeaders() });
  tratar401(r);
  if (!r.ok && r.status !== 204) throw new Error("DELETE " + path);
}

// Soma meses a uma data completa (YYYY-MM-DD), mantendo o dia quando possível
function addMesesData(dateStr, n) {
  const base = (dateStr || todayStr()).slice(0, 10);
  const [y, m, d] = base.split("-").map(Number);
  const dt = new Date(y, (m - 1) + n, d);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}
// A comissão do seguro vira N lançamentos no financeiro (um por mês, "a receber")
function montarLancamentosComissao(item) {
  const n = Math.max(1, Math.min(12, parseInt(item.parcelasComissao, 10) || 1));
  const total = item.valorComissao || 0;
  const base = item.dataAgendamento || todayStr();
  const valorBase = Math.floor((total / n) * 100) / 100;
  const lancs = [];
  for (let k = 1; k <= n; k++) {
    const valor = k === n ? Math.round((total - valorBase * (n - 1)) * 100) / 100 : valorBase;
    lancs.push({
      id: uid(), cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
      valorPago: valor, custo: 0, forma: item.forma || "",
      data: n === 1 ? base : addMesesData(base, k - 1),
      pago: n === 1 ? (item.pagamento !== "pendente") : false,
      atendimentoId: item.id, parcela: k, totalParcelas: n,
    });
  }
  return lancs;
}

          <Field label="Valor (R$)">

          <Field label="Custo (R$)">
            <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={custo}
                   onChange={(e) => setCusto(e.target.value)} placeholder="0,00" />
            <p className="text-[11px] mt-1" style={{ color: COLORS.inkSoft }}>

          {valor && (
            <React.Fragment>
              <Field label="Situação">
                <div className="flex gap-2">
                  <Toggle ativo={pagamento === "pago"} cor={COLORS.green} onClick={() => setPagamento("pago")}>Pago</Toggle>
                  <Toggle ativo={pagamento === "pendente"} cor={COLORS.camelDeep} onClick={() => setPagamento("pendente")}>Pendente</Toggle>
                </div>

              {pagamento === "pago" && (
                <Field label="Forma de pagamento">
                  <select style={inputStyle} value={forma} onChange={(e) => setForma(e.target.value)}>

              )}
              <p className="text-[11px]" style={{ color: COLORS.inkSoft }}>
                {(!item || statusDoItem(item) === "solicitado")
                  ? "Enquanto estiver em Solicitado, este valor não entra no financeiro. Ele passa a contar quando você mover para Agendado ou Emitido."
                  : (pagamento === "pago"
                      ? "Este valor será somado ao Recebido no financeiro."
                      : "Este valor entra em A receber e não soma no Recebido até você marcar como pago.")}

      <Field label="Observações">

      <PrimaryButton onClick={submit}>{submitLabel}</PrimaryButton>
    </React.Fragment>
  );
}

function KanbanBoard({ atendimentos, onAdd, onMove, onDelete, onEdit, clientes, mesKanban, financeiro }) {
  // Ao editar um seguro, recupera a % de comissão a partir do lançamento financeiro vinculado
  // (assim ela continua certa mesmo depois de recarregar a página).
  const comissaoDoAtendimento = (at) => {
    if (!at || at.categoria !== "seguro") return null;
    if (at.comissao != null) return at.comissao;
    const lanc = (financeiro || []).find((f) => f.atendimentoId === at.id);
    if (!lanc || !at.valor) return null;
    return Math.round((lanc.valorPago / at.valor) * 10000) / 100;
  };
  const [showAdd, setShowAdd] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [showFiltros, setShowFiltros] = useState(false);
  const [aba, setAba] = useState("seguro");
  const [fSubtipo, setFSubtipo] = useState(null);
  const [fNome, setFNome] = useState("");
  const [fData, setFData] = useState("");
  const [fMesAno, setFMesAno] = useState("");
  const today = todayStr();

  // Cada aba mostra só a sua categoria — seguro e certificado têm fluxos diferentes.
  // A aba "Outros" só aparece se existir algum atendimento assim, para nada sumir da tela.
  const temOutros = atendimentos.some((a) => a.categoria === "outros");
  const abas = [
    { key: "seguro", label: "Seguros" },
    { key: "certificado", label: "Certificados" },
  ].concat(temOutros ? [{ key: "outros", label: "Outros" }] : []);
  const abaAtual = abas.some((t) => t.key === aba) ? aba : "seguro";

  const daAba = atendimentos.filter((a) => a.categoria === abaAtual);
  const hojeCount = daAba.filter((a) => (a.criadoEm || "").slice(0, 10) === today).length;

  // Só os atendimentos do mês selecionado no cabeçalho
  let filtrados = daAba.filter((a) => (a.criadoEm || "").slice(0, 7) === mesKanban);
  if (fSubtipo) filtrados = filtrados.filter((a) => a.subtipo === fSubtipo);
  if (fNome.trim()) filtrados = filtrados.filter((a) => a.cliente.toLowerCase().includes(fNome.trim().toLowerCase()));
  if (fData) filtrados = filtrados.filter((a) => (a.criadoEm || "").slice(0, 10) === fData);
  if (fMesAno) filtrados = filtrados.filter((a) => (a.criadoEm || "").slice(0, 7) === fMesAno);

  const filtrosAtivos = [fSubtipo, fNome.trim(), fData, fMesAno].filter(Boolean).length;
  const limparFiltros = () => { setFSubtipo(null); setFNome(""); setFData(""); setFMesAno(""); };
  const colunas = statusesDe(abaAtual);

  return (
    <div>
      <ProximosVencimentos clientes={clientes} />
      <div className="flex items-center justify-between mb-3">
        <div>
          <h2 className="text-lg font-semibold" style={{ color: COLORS.ink, letterSpacing: "-0.2px" }}>Atendimentos</h2>
          <p className="text-xs" style={{ color: COLORS.inkSoft }}>{hojeCount} recebido(s) hoje · {filtrados.length} em {monthLabelLong(mesKanban)}</p>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setShowFiltros((v) => !v)}
                  className="relative flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium"
                  style={{ backgroundColor: showFiltros ? COLORS.burgundy : COLORS.burgundy + "14", color: showFiltros ? "#fff" : COLORS.burgundy }}>
            <Filter size={15} color={showFiltros ? "#fff" : COLORS.burgundy} /> Filtros
            {filtrosAtivos > 0 && (
              <span className="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full text-[9px] flex items-center justify-center font-bold"
                    style={{ backgroundColor: COLORS.red, color: "#fff" }}>{filtrosAtivos}</span>
            )}
          </button>
          <button onClick={() => setShowAdd(true)}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium"
                  style={{ backgroundColor: COLORS.burgundy, color: "#fff" }}>
            <Plus size={16} color="#fff" /> Novo
          </button>
        </div>
      </div>

      <div className="flex gap-1 p-1 rounded-lg mb-4" style={{ backgroundColor: COLORS.burgundy }}>
        {abas.map((t) => (
          <button key={t.key} onClick={() => { setAba(t.key); setFSubtipo(null); }}
                  className="flex-1 py-2 rounded-lg text-xs font-semibold"
                  style={{ backgroundColor: abaAtual === t.key ? "#fff" : "transparent",
                           color: abaAtual === t.key ? COLORS.burgundy : "rgba(255,255,255,0.75)" }}>
            {t.label}
          </button>
        ))}
      </div>

      {showFiltros && (
        <div className="rounded-lg p-3 mb-4" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
          <Field label={abaAtual === "seguro" ? "Qual seguro?" : abaAtual === "certificado" ? "Qual certificado?" : "Qual tipo?"}>
            <select style={inputStyle} value={fSubtipo || ""} onChange={(e) => setFSubtipo(e.target.value || null)}>
              <option value="">Todos</option>
              {(SUBTIPOS[abaAtual] || []).map((o) => <option key={o.key} value={o.key}>{o.label}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Nome do cliente">
              <input style={inputStyle} value={fNome} onChange={(e) => setFNome(e.target.value)} placeholder="Buscar..." />
            </Field>
            <Field label="Mês e ano">
              <input type="month" style={inputStyle} value={fMesAno} onChange={(e) => setFMesAno(e.target.value)} />
            </Field>
          </div>
          <Field label="Data exata da solicitação (opcional)">
            <input type="date" style={inputStyle} value={fData} onChange={(e) => setFData(e.target.value)} />
          </Field>
          {filtrosAtivos > 0 && (
            <button onClick={limparFiltros} className="flex items-center gap-1 text-xs font-medium px-3 py-1.5 rounded-lg"
                    style={{ backgroundColor: "#F1F3F6", color: COLORS.inkSoft }}>
              <X size={12} color={COLORS.inkSoft} /> Limpar filtros
            </button>
          )}
        </div>
      )}

      <div className="flex gap-3 overflow-x-auto pb-3">
        {colunas.map((s) => {
          const items = filtrados.filter((a) => statusDoItem(a) === s.key);
          return (
            <div key={s.key} className="flex-shrink-0" style={{ width: colunas.length <= 3 ? 300 : 250 }}>
              <div className="flex items-center gap-2 mb-2 px-1">
                <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: s.color }} />
                <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>{s.label}</span>
                <span className="text-xs ml-auto" style={{ color: COLORS.inkSoft }}>{items.length}</span>
              </div>
              <div className="rounded-lg p-2" style={{ backgroundColor: "#F1F3F6", minHeight: 80 }}>
                {items.length === 0 && <p className="text-xs text-center py-6" style={{ color: COLORS.inkSoft }}>Vazio</p>}
                {items.map((item) => <AtendimentoCard key={item.id} item={item} onMove={onMove} onDelete={onDelete} onEdit={setEditingItem} comissaoPct={comissaoDoAtendimento(item)} />)}
              </div>
            </div>
          );
        })}
      </div>

      {showAdd && <AddAtendimentoModal categoriaInicial={abaAtual} onClose={() => setShowAdd(false)} onSave={onAdd} />}
      {editingItem && (
        <EditAtendimentoModal
          item={editingItem}
          comissaoInicial={comissaoDoAtendimento(editingItem)}
          onClose={() => setEditingItem(null)}
          onSave={onEdit}
        />
      )}
    </div>
  );
}

function GoogleAgendaConexao() {
  const [estado, setEstado] = useState(null); // null=carregando, {conectado, configurado}
  const [ocupado, setOcupado] = useState(false);

  const carregarStatus = async () => {
    try { setEstado(await apiGet("/api/google/status")); }
    catch (e) { setEstado({ conectado: false, configurado: false, erro: true }); }
  };
  useEffect(() => { carregarStatus(); }, []);

  const conectar = async () => {
    setOcupado(true);
    try {
      const { url } = await apiGet("/api/google/connect");
      window.open(url, "_blank");
    } catch (e) { console.error(e); }
    setOcupado(false);
  };
  const desconectar = async () => {
    setOcupado(true);
    try { await apiPost("/api/google/disconnect", {}); await carregarStatus(); }
    catch (e) { console.error(e); }
    setOcupado(false);
  };

  if (!estado) return null;

  return (
    <div className="rounded-lg p-3 mb-4 flex items-center justify-between gap-2" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
      <div className="flex items-center gap-2 min-w-0">
        <CalendarPlus size={16} color={estado.conectado ? COLORS.green : COLORS.inkSoft} />
        <div className="min-w-0">
          <div className="text-xs font-semibold" style={{ color: COLORS.ink }}>Google Agenda</div>
          <div className="text-[11px]" style={{ color: estado.conectado ? COLORS.green : COLORS.inkSoft }}>
            {estado.conectado ? "Conectado" : (estado.configurado ? "Não conectado" : "Indisponível no servidor")}
          </div>
        </div>
      </div>
      <div className="flex items-center gap-1.5 flex-shrink-0">
        {estado.conectado ? (
          <button onClick={desconectar} disabled={ocupado} className="text-xs font-medium px-2.5 py-1.5 rounded-lg" style={{ color: COLORS.red, backgroundColor: COLORS.red + "12" }}>Desconectar</button>
        ) : (
          <button onClick={conectar} disabled={ocupado || !estado.configurado} className="text-xs font-medium px-2.5 py-1.5 rounded-lg" style={{ color: "#fff", backgroundColor: estado.configurado ? COLORS.burgundy : COLORS.inkSoft }}>{ocupado ? "Abrindo…" : "Conectar"}</button>
        )}
        <button onClick={carregarStatus} disabled={ocupado} className="p-1.5 rounded-lg hover:bg-black/5" title="Atualizar status">
          <RefreshCw size={13} color={COLORS.inkSoft} />
        </button>
      </div>
    </div>
  );
}

function CalendarView({ agendamentos, onAdd, onDelete }) {
  const [cursor, setCursor] = useState(new Date());
  const [selectedDay, setSelectedDay] = useState(todayStr());
  const [showAdd, setShowAdd] = useState(false);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const dateStrFor = (d) => `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        {dayItems.map((item) => (
          <div key={item.id} className="rounded-lg p-3 flex items-center gap-3"

              <div className="text-sm font-bold" style={{ color: COLORS.ink }}>{item.horario}</div>

      {showAdd && <AddAgendamentoModal dateStr={selectedDay} onClose={() => setShowAdd(false)} onSave={onAdd} />}

  );
}

function FinanceForm({ item, onSubmit, submitLabel }) {
  const [cliente, setCliente] = useState(item ? item.cliente : "");
  const [categoria, setCategoria] = useState(item ? item.categoria : "seguro");
  const [subtipo, setSubtipo] = useState(item ? item.subtipo : SUBTIPOS.seguro[0].key);
  const [valorPago, setValorPago] = useState(item ? String(item.valorPago) : "");
  const [custo, setCusto] = useState(item && item.custo ? String(item.custo) : "");
  const [forma, setForma] = useState(item && item.forma ? item.forma : FORMAS_PAGAMENTO[0]);
  const [data, setData] = useState(item ? item.data : todayStr());
  const [pago, setPago] = useState(item ? item.pago : true);

  const submit = () => {
    if (!cliente.trim() || !valorPago) return;
    onSubmit({
      cliente: cliente.trim(), categoria, subtipo,
      valorPago: parseFloat(valorPago) || 0, custo: parseFloat(custo) || 0,
      forma: pago ? forma : "", data, pago,
    });
  };

  return (
    <React.Fragment>
      <Field label="Cliente">
        <input style={inputStyle} value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Nome do cliente" autoFocus />
      </Field>
      <CategoriaSubtipoPicker categoria={categoria} setCategoria={setCategoria} subtipo={subtipo} setSubtipo={setSubtipo} />
      <div className="grid grid-cols-2 gap-2">
        <Field label="Valor (R$)">
          <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={valorPago}
                 onChange={(e) => setValorPago(e.target.value)} placeholder="0,00" />
        </Field>
        <Field label="Custo (R$)">
          <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={custo}
                 onChange={(e) => setCusto(e.target.value)} placeholder="0,00" />
        </Field>
      </div>
      <Field label="Situação">
        <div className="flex gap-2">
          <Toggle ativo={pago} cor={COLORS.green} onClick={() => setPago(true)}>Pago</Toggle>
          <Toggle ativo={!pago} cor={COLORS.camelDeep} onClick={() => setPago(false)}>Pendente</Toggle>
        </div>
      </Field>
      {pago && (
        <Field label="Forma de pagamento">
          <select style={inputStyle} value={forma} onChange={(e) => setForma(e.target.value)}>
            {FORMAS_PAGAMENTO.map((f) => <option key={f} value={f}>{f}</option>)}
          </select>
        </Field>
      )}
      <Field label={pago ? "Data do recebimento" : "Data prevista de recebimento"}>
        <input type="date" style={inputStyle} value={data} onChange={(e) => setData(e.target.value)} />
      </Field>
      <p className="text-[11px] mb-3" style={{ color: COLORS.inkSoft }}>
        {pago
          ? "Entra em \"Recebido\" no mês desta data."
          : "Fica em \"A receber\" no mês desta data (quando você vai receber). Ao marcar como pago, passa para \"Recebido\" no mês da baixa."}
      </p>
      <PrimaryButton onClick={submit}>{submitLabel}</PrimaryButton>
    </React.Fragment>
  );
}

// Gastos da empresa (despesas com tipo negocio_*). Avulso conta só no mês; conta fixa recorre a partir do início.
function ehGastoNegocio(d) { return d.tipo === "negocio_avulso" || d.tipo === "negocio_fixa"; }
function gastoNoMes(d, mk) {
  if (!ehGastoNegocio(d)) return false;
  if (d.tipo === "negocio_fixa") return monthKey(d.data) <= mk;
  return monthKey(d.data) === mk;
}

// Variação percentual entre dois períodos. Sem base de comparação, devolve null.
function variacaoPct(atual, anterior) {
  if (!anterior) return null;
  return Math.round(((atual - anterior) / Math.abs(anterior)) * 100);
}

function Card({ titulo, valor, cor, Icon, destaque, onClick, ativo, variacao, mesAnterior, sobeEhBom }) {
  return (
    <div onClick={onClick}
         className="rounded-lg p-4"
         style={{ backgroundColor: destaque ? COLORS.burgundy : COLORS.panel,
                  border: destaque ? "none" : `${ativo ? 2 : 1}px solid ${ativo ? cor : (cor === COLORS.camelDeep ? COLORS.camel : COLORS.line)}`,
                  boxShadow: ativo ? `0 0 0 3px ${cor}1F` : "none",
                  cursor: onClick ? "pointer" : "default" }}>
      <div className="flex items-center gap-1.5 mb-1" style={{ color: destaque ? "#F2D9DE" : cor }}>
        <Icon size={14} color={destaque ? "#F2D9DE" : cor} />
        <span className="text-xs font-medium">{titulo}</span>
      </div>
      <div className="text-lg font-bold"
           style={{ color: destaque ? "#fff" : (cor === COLORS.camelDeep ? COLORS.camelDeep : COLORS.ink),
                    fontFamily: "ui-monospace, monospace" }}>{fmtMoney(valor)}</div>
      {variacao != null && (() => {
        const subiu = variacao > 0;
        const neutro = variacao === 0;
        // "Bom" depende do indicador: receita subindo é bom, despesa subindo não é
        const bom = sobeEhBom === false ? !subiu : subiu;
        const corVar = destaque
          ? "rgba(255,255,255,0.85)"
          : neutro ? COLORS.inkSoft : (bom ? COLORS.green : COLORS.red);
        return (
          <div className="text-[10px] mt-1 font-medium" style={{ color: corVar }}>
            {neutro ? "sem mudança" : `${subiu ? "▲" : "▼"} ${Math.abs(variacao)}%`}
            {mesAnterior ? ` vs ${mesAnterior}` : ""}
          </div>
        );
      })()}
    </div>
  );
}

function GraficoEntradasSaidas({ dados }) {
  const maior = Math.max(1, ...dados.map((d) => Math.max(d.entradas, d.saidas)));
  const alturaBarra = (v) => (v <= 0 ? 2 : Math.max(3, Math.round((v / maior) * 100)));

  return (
    <div className="rounded-lg p-4" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
      <div className="flex items-center justify-between mb-3">
        <span className="text-sm font-semibold" style={{ color: COLORS.ink }}>Entradas e saídas</span>
        <span className="text-[11px] flex items-center gap-3" style={{ color: COLORS.inkSoft }}>
          <span className="flex items-center gap-1">
            <span style={{ width: 9, height: 9, borderRadius: 2, backgroundColor: COLORS.green, display: "inline-block" }} /> entradas
          </span>
          <span className="flex items-center gap-1">
            <span style={{ width: 9, height: 9, borderRadius: 2, backgroundColor: COLORS.red, display: "inline-block" }} /> saídas
          </span>
        </span>
      </div>

      <div className="flex gap-3" style={{ height: 110, alignItems: "flex-end" }}>
        {dados.map((d) => (
          <div key={d.mes} className="flex-1 flex items-end gap-1" style={{ height: "100%" }} title={`${d.label}: entradas ${fmtMoney(d.entradas)} · saídas ${fmtMoney(d.saidas)}`}>
            <div style={{ flex: 1, height: `${alturaBarra(d.entradas)}%`, backgroundColor: COLORS.green, borderRadius: "3px 3px 0 0" }} />
            <div style={{ flex: 1, height: `${alturaBarra(d.saidas)}%`, backgroundColor: COLORS.red, borderRadius: "3px 3px 0 0" }} />
          </div>
        ))}
      </div>
      <div className="flex gap-3 mt-1.5">
        {dados.map((d) => (
          <div key={d.mes} className="flex-1 text-center text-[10px] capitalize" style={{ color: COLORS.inkSoft }}>{d.label}</div>
        ))}
      </div>
    </div>
  );
}

function NegocioFinanceiro({ financeiro, onAdd, onEdit, onDelete, onMarcarPago,
                             despesas, onAddDespesa, onEditDespesa, onDeleteDespesa,
                             contas, movimentacoes, onAddConta, onDeleteConta, onAddMov, onDeleteMov, onSetPrincipal }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [showAddGasto, setShowAddGasto] = useState(false);
  const [editingGasto, setEditingGasto] = useState(null);
  const [filtro, setFiltro] = useState(null);
  const [refMes, setRefMes] = useState(monthKey(todayStr()));

  // Regime de caixa: o recebido conta no mês da baixa (data do lançamento já pago).
  // O pendente aparece no mês da DATA PREVISTA DE RECEBIMENTO (campo "data" do lançamento).
  const recebidosDoMes = financeiro.filter((f) => f.pago && monthKey(f.data) === refMes);
  const pendentesDoMes = financeiro.filter((f) => !f.pago && monthKey(f.data) === refMes);
  const totalRecebido = recebidosDoMes.reduce((s, f) => s + (f.valorPago || 0), 0);
  const totalAReceber = pendentesDoMes.reduce((s, f) => s + (f.valorPago || 0), 0);
  const totalCusto = recebidosDoMes.reduce((s, f) => s + (f.custo || 0), 0);
  const sorted = [...recebidosDoMes, ...pendentesDoMes].sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  const gastosDoMes = (despesas || []).filter((d) => gastoNoMes(d, refMes))
    .sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  const totalGastosNegocio = gastosDoMes.reduce((s, d) => s + (d.valor || 0), 0);

  const lucro = totalRecebido - totalCusto - totalGastosNegocio;

  // Mesmos números do mês anterior, para mostrar a variação em cada indicador
  const mesAnterior = addMonths(refMes, -1);
  const recebidosAnt = financeiro.filter((f) => f.pago && monthKey(f.data) === mesAnterior);
  const totalRecebidoAnt = recebidosAnt.reduce((s, f) => s + (f.valorPago || 0), 0);
  const totalCustoAnt = recebidosAnt.reduce((s, f) => s + (f.custo || 0), 0);
  const totalAReceberAnt = financeiro
    .filter((f) => !f.pago && monthKey(f.data) === mesAnterior)
    .reduce((s, f) => s + (f.valorPago || 0), 0);
  const totalGastosAnt = (despesas || []).filter((d) => gastoNoMes(d, mesAnterior))
    .reduce((s, d) => s + (d.valor || 0), 0);
  const lucroAnt = totalRecebidoAnt - totalCustoAnt - totalGastosAnt;
  const labelMesAnt = monthLabelShort(mesAnterior);

  // Contas da empresa (PJ). A conta do negócio recebe recebimentos e gastos automaticamente.
  const contasPJ = (contas || []).filter((c) => c.tipo === "pj");
  const fluxoNegocio = fluxoNegocioConta(financeiro, despesas);
  const totalContasPJ = contasPJ.reduce((s, c) => s + saldoDaConta(c, movimentacoes || [], fluxoNegocio), 0);

  let visiveis = sorted;
  if (filtro === "pago") visiveis = sorted.filter((f) => f.pago);
  else if (filtro === "pendente") visiveis = sorted.filter((f) => !f.pago);
  else if (filtro === "custo") visiveis = sorted.filter((f) => (f.custo || 0) > 0);
  const labelFiltro = { pago: "Recebido", pendente: "A receber", custo: "Custo" }[filtro];

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <p className="text-xs" style={{ color: COLORS.inkSoft }}>Recebimentos e custos do negócio</p>
        <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium"
                style={{ backgroundColor: COLORS.burgundy, color: "#fff" }}>
          <Plus size={16} color="#fff" /> Lançar
        </button>
      </div>

      <div className="rounded-lg p-2 mb-3 flex items-center justify-between" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
        <button onClick={() => setRefMes((m) => addMonths(m, -1))} className="p-1.5 rounded-lg hover:bg-black/5" title="Mês anterior">
          <ChevronLeft size={18} color={COLORS.inkSoft} />
        </button>
        <div className="text-center leading-tight">
          <div className="text-[11px]" style={{ color: COLORS.inkSoft }}>Mês</div>
          <div className="text-sm font-semibold capitalize" style={{ color: COLORS.ink }}>{monthLabelShort(refMes)}</div>
          {refMes !== monthKey(todayStr()) && (
            <button onClick={() => setRefMes(monthKey(todayStr()))} className="text-[10px] underline" style={{ color: COLORS.inkSoft }}>voltar ao mês atual</button>
          )}
        </div>
        <button onClick={() => setRefMes((m) => addMonths(m, 1))} className="p-1.5 rounded-lg hover:bg-black/5" title="Próximo mês">
          <ChevronRight size={18} color={COLORS.inkSoft} />
        </button>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <Card titulo="Recebido" valor={totalRecebido} cor={COLORS.green} Icon={TrendingUp}
              variacao={variacaoPct(totalRecebido, totalRecebidoAnt)} mesAnterior={labelMesAnt} sobeEhBom
              onClick={() => setFiltro(filtro === "pago" ? null : "pago")} ativo={filtro === "pago"} />
        <Card titulo="A receber" valor={totalAReceber} cor={COLORS.camelDeep} Icon={Hourglass}
              variacao={variacaoPct(totalAReceber, totalAReceberAnt)} mesAnterior={labelMesAnt} sobeEhBom
              onClick={() => setFiltro(filtro === "pendente" ? null : "pendente")} ativo={filtro === "pendente"} />
        <Card titulo="Custo dos atendimentos" valor={totalCusto} cor={COLORS.red} Icon={TrendingDown}
              variacao={variacaoPct(totalCusto, totalCustoAnt)} mesAnterior={labelMesAnt} sobeEhBom={false}
              onClick={() => setFiltro(filtro === "custo" ? null : "custo")} ativo={filtro === "custo"} />
        <Card titulo="Gastos da empresa" valor={totalGastosNegocio} cor={COLORS.slate} Icon={Receipt}

      <div className="mb-3">

      <div className="flex items-center gap-1.5 mb-2 mt-1">
        <TrendingUp size={15} color={COLORS.green} />
        <h3 className="text-sm font-semibold" style={{ color: COLORS.ink }}>Recebimentos · {monthLabelShort(refMes)}</h3>

function DespesaForm({ item, tipoInicial, onSubmit, submitLabel }) {
  const [titulo, setTitulo] = useState(item ? item.titulo : "");
  const [tipo, setTipo] = useState(item ? item.tipo : (tipoInicial || "avulso"));
  const [valor, setValor] = useState(item ? String(item.valor) : "");
  const [data, setData] = useState(item ? item.data : todayStr());
  const [forma, setForma] = useState(item && item.forma ? item.forma : FORMAS_DESPESA[0]);
  const [notas, setNotas] = useState(item ? item.notas : "");

  const submit = () => {
    if (!titulo.trim() || !valor) return;
    onSubmit({ titulo: titulo.trim(), tipo, valor: parseFloat(valor) || 0, data, forma, notas: notas.trim() });
  };

  return (
    <React.Fragment>
      <Field label="Título da despesa">
        <input style={inputStyle} value={titulo} onChange={(e) => setTitulo(e.target.value)}
               placeholder="Ex: Conta de internet, Uber, Mercado..." autoFocus />
      </Field>
      <Field label="Tipo">
        <div className="flex gap-2">
          {TIPOS_DESPESA.map((t) => (
            <Toggle key={t.key} ativo={tipo === t.key} cor={t.color} onClick={() => setTipo(t.key)}>{t.label}</Toggle>
          ))}
        </div>
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Valor (R$)">
          <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={valor}
                 onChange={(e) => setValor(e.target.value)} placeholder="0,00" />
        </Field>
        <Field label={tipo === "fixa" ? "Todo dia" : "Data"}>
          <input type="date" style={inputStyle} value={data} onChange={(e) => setData(e.target.value)} />
        </Field>
      </div>
      <Field label="Como foi paga">
        <select style={inputStyle} value={forma} onChange={(e) => setForma(e.target.value)}>
          {FORMAS_DESPESA.map((f) => <option key={f} value={f}>{f}</option>)}
        </select>
      </Field>
      {tipo === "fixa" && (
        <p className="text-[11px] mb-3" style={{ color: COLORS.inkSoft }}>
          Contas fixas entram todo mês na projeção, a partir dessa data, até você editar ou excluir.
        </p>
      )}
      <Field label="Observações">
        <textarea style={{ ...inputStyle, minHeight: 50, resize: "vertical" }} value={notas} onChange={(e) => setNotas(e.target.value)} />
      </Field>
      <PrimaryButton onClick={submit}>{submitLabel}</PrimaryButton>
    </React.Fragment>
  );
}

function CompraForm({ item, cartaoId, onSubmit, submitLabel }) {
  const [descricao, setDescricao] = useState(item ? item.descricao : "");
  const [valorParcela, setValorParcela] = useState(item ? String(item.valorParcela) : "");
  const [dataCompra, setDataCompra] = useState(item ? item.dataCompra : todayStr());
  const [parcelas, setParcelas] = useState(item ? String(item.parcelas) : "1");
  const [notas, setNotas] = useState(item ? item.notas : "");

  const submit = () => {
    if (!descricao.trim() || !valorParcela) return;
    onSubmit({
      cartaoId: item ? item.cartaoId : cartaoId,
      descricao: descricao.trim(), valorParcela: parseFloat(valorParcela) || 0,
      dataCompra, parcelas: parseInt(parcelas, 10) || 1, notas: notas.trim(),
    });
  };

  const nParc = parseInt(parcelas, 10) || 1;

  return (
    <React.Fragment>
      <Field label="Descrição da compra">
        <input style={inputStyle} value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder="Ex: Notebook, passagem aérea..." autoFocus />
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Valor da parcela (R$)">
          <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={valorParcela}
                 onChange={(e) => setValorParcela(e.target.value)} placeholder="0,00" />
        </Field>
        <Field label="Nº de parcelas">
          <input type="number" min="1" style={inputStyle} value={parcelas} onChange={(e) => setParcelas(e.target.value)} />
        </Field>
      </div>
      <Field label="Mês da 1ª parcela na fatura">
        <input type="date" style={inputStyle} value={dataCompra} onChange={(e) => setDataCompra(e.target.value)} />
      </Field>
      {nParc > 1 ? (
        <p className="text-[11px] mb-3" style={{ color: COLORS.inkSoft }}>
          Entra na fatura por {nParc} meses, a 1ª parcela em {monthLabelShort(monthKey(dataCompra))}, {fmtMoney(parseFloat(valorParcela) || 0)}/mês. Última parcela em {monthLabelShort(addMonths(monthKey(dataCompra), nParc - 1))}.
        </p>
      ) : (
        <p className="text-[11px] mb-3" style={{ color: COLORS.inkSoft }}>
          Entra na fatura de {monthLabelShort(monthKey(dataCompra))}. Use a data de vencimento da fatura onde a compra aparece.
        </p>
      )}
      <Field label="Observações">
        <textarea style={{ ...inputStyle, minHeight: 50, resize: "vertical" }} value={notas} onChange={(e) => setNotas(e.target.value)} />
      </Field>
      <PrimaryButton onClick={submit}>{submitLabel}</PrimaryButton>
    </React.Fragment>
  );
}

// Estorno: lançado como uma "compra" de valor negativo em 1 parcela,
// então abate direto da fatura do mês em que cai.
function EstornoModal({ cartaoId, onClose, onSave }) {
  const [descricao, setDescricao] = useState("");
  const [valor, setValor] = useState("");
  const [data, setData] = useState(todayStr());
  const submit = () => {
    const v = parseFloat(valor) || 0;
    if (!descricao.trim() || v <= 0) return;
    onSave({ id: uid(), cartaoId, descricao: descricao.trim(), valorParcela: -Math.abs(v),
             dataCompra: data, parcelas: 1, notas: "" });
    onClose();
  };
  return (
    <Modal title="Registrar estorno" onClose={onClose}>
      <Field label="Descrição">
        <input style={inputStyle} value={descricao} onChange={(e) => setDescricao(e.target.value)}
               placeholder="Ex: Estorno da compra na loja X" autoFocus />

      <div className="grid grid-cols-2 gap-2">
        <Field label="Valor estornado (R$)">
          <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={valor}
                 onChange={(e) => setValor(e.target.value)} placeholder="0,00" />
        </Field>
        <Field label="Data do estorno">
          <input type="date" style={inputStyle} value={data} onChange={(e) => setData(e.target.value)} />
        </Field>
      </div>
      <p className="text-[11px] mb-3" style={{ color: COLORS.inkSoft }}>
        O valor entra como crédito e abate da fatura do mês desta data.
      </p>
      <PrimaryButton onClick={submit}>Salvar estorno</PrimaryButton>
    </Modal>
  );
}

// ====== CONTAS PESSOAIS ======
function saldoDaConta(conta, movimentacoes, fluxoNegocio) {
  let saldo = (movimentacoes || [])
    .filter((m) => m.contaId === conta.id)
    .reduce((s, m) => s + (m.tipo === "saida" ? -(m.valor || 0) : (m.valor || 0)), conta.saldoInicial || 0);
  // Na conta do negócio, os recebimentos e gastos da empresa entram automaticamente
  if (conta.principal && fluxoNegocio) {
    saldo += fluxoNegocio.reduce((s, m) => s + (m.tipo === "saida" ? -(m.valor || 0) : (m.valor || 0)), 0);
  }
  return saldo;
}

// Lançamentos automáticos da conta do negócio: recebimentos (entradas) e gastos da empresa (saídas).
// São calculados, não salvos — então nunca duplicam e somem se você apagar o recebimento/gasto.
function fluxoNegocioConta(financeiro, despesas) {
  const movs = [];
  (financeiro || []).forEach((f) => {
    if (f.pago && (f.valorPago || 0) !== 0) {
      movs.push({ id: "auto-rec-" + f.id, auto: true, tipo: "entrada", valor: f.valorPago || 0,
                  descricao: "Recebido · " + f.cliente
                    + (f.totalParcelas > 1 ? ` (comissão ${f.parcela}/${f.totalParcelas})` : ""),
                  data: f.data });
    }
    // O custo do atendimento (ex: custo do certificado) sai da conta, para mostrar o valor real
    if (f.pago && (f.custo || 0) > 0) {
      movs.push({ id: "auto-custo-" + f.id, auto: true, tipo: "saida", valor: f.custo,
                  descricao: "Custo · " + f.cliente, data: f.data });
    }
  });
  const mesAtual = monthKey(todayStr());
  (despesas || []).forEach((d) => {
    if (d.tipo === "negocio_avulso") {
      movs.push({ id: "auto-gasto-" + d.id, auto: true, tipo: "saida", valor: d.valor || 0,
                  descricao: "Gasto · " + d.titulo, data: d.data });
    } else if (d.tipo === "negocio_fixa") {
      // Conta fixa recorre todo mês, do início até o mês atual
      const dia = (d.data || "").slice(8, 10) || "01";
      let mk = monthKey(d.data);
      let guard = 0;
      while (mk <= mesAtual && guard < 240) {
        movs.push({ id: "auto-fix-" + d.id + "-" + mk, auto: true, tipo: "saida", valor: d.valor || 0,
                    descricao: "Conta fixa · " + d.titulo, data: mk + "-" + dia });
        mk = addMonths(mk, 1); guard++;
      }
    }
  });
  return movs.sort((a, b) => (b.data || "").localeCompare(a.data || ""));
}

    if (!nome.trim()) return;
    onSave({ id: uid(), nome: nome.trim(), saldoInicial: parseFloat(saldo) || 0, tipo: tipo || "pf" });
    onClose();

  return (
    <Modal title="Nova conta" onClose={onClose}>
      <Field label="Nome da conta">
        <input style={inputStyle} value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Ex: Bradesco, C6, Carteira" autoFocus />

                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold truncate flex items-center gap-1.5" style={{ color: COLORS.ink }}>
                      {c.nome}
                      {c.principal && (
                        <span className="px-1.5 py-0.5 rounded-full text-[9px] font-bold whitespace-nowrap"
                              style={{ backgroundColor: COLORS.camel + "26", color: COLORS.camelDeep }}>CONTA DO NEGÓCIO</span>
                      )}
                    </div>
                    <div className="text-xs" style={{ color: COLORS.inkSoft }}>{movs.length} movimentação(ões)</div>
                  </div>
                </button>
                <div className="text-sm font-bold flex-shrink-0" style={{ color: saldo < 0 ? COLORS.red : COLORS.ink, fontFamily: "ui-monospace, monospace" }}>
                  {fmtMoney(saldo)}
                </div>
                {podeDesignar && (
                  <button onClick={() => onSetPrincipal(c.principal ? null : c.id)}
                          className="p-1.5 rounded-lg hover:bg-black/5 flex-shrink-0"
                          title={c.principal ? "Deixar de ser a conta do negócio" : "Definir como conta do negócio (recebe automaticamente)"}>
                    <Star size={15} color={c.principal ? COLORS.camelDeep : COLORS.inkSoft} fill={c.principal ? COLORS.camel : "none"} />
                  </button>
                )}
                <button onClick={() => setMovDaConta(c)} className="p-1.5 rounded-lg hover:bg-black/5 flex-shrink-0" title="Lançar movimentação">
                  <Plus size={15} color={COLORS.inkSoft} />
                </button>
                <button onClick={() => onDeleteConta(c.id)} className="p-1.5 rounded-lg hover:bg-black/5 flex-shrink-0" title="Excluir conta">
                  <Trash2 size={14} color={COLORS.inkSoft} />
                </button>
              </div>

              {estaAberta && (
                <div className="px-3 pb-3">
                  {c.principal && (
                    <p className="text-[11px] mb-1.5 px-1" style={{ color: COLORS.camelDeep }}>
                      Recebimentos e gastos da empresa entram aqui sozinhos (marcados como "auto").
                    </p>
                  )}
                  <div className="flex items-center justify-between text-[11px] py-1.5 px-2 rounded-lg mb-1" style={{ backgroundColor: "#F1F3F6", color: COLORS.inkSoft }}>
                    <span>Saldo inicial</span>
                    <span style={{ fontFamily: "ui-monospace, monospace" }}>{fmtMoney(c.saldoInicial)}</span>
                  </div>
                  {movs.length === 0 && <p className="text-[11px] py-2 text-center" style={{ color: COLORS.inkSoft }}>Nenhuma movimentação ainda</p>}
                  {movs.map((m) => (
                    <div key={m.id} className="flex items-center gap-2 text-xs py-1.5" style={{ borderTop: `1px dashed ${COLORS.line}` }}>
                      <span className="flex-1 min-w-0 truncate" style={{ color: COLORS.ink }}>
                        {m.descricao || (m.tipo === "entrada" ? "Entrada" : "Saída")}
                        {m.auto && <span className="ml-1 px-1 py-0.5 rounded text-[9px] font-bold" style={{ backgroundColor: COLORS.line, color: COLORS.inkSoft }}>auto</span>}
                        <span style={{ color: COLORS.inkSoft }}> · {fmtDatePt(m.data)}</span>
                      </span>
                      <span className="font-bold flex-shrink-0" style={{ color: m.tipo === "entrada" ? COLORS.green : COLORS.red, fontFamily: "ui-monospace, monospace" }}>
                        {m.tipo === "entrada" ? "+" : "−"} {fmtMoney(m.valor)}
                      </span>
                      {m.auto ? (
                        <span className="w-6 flex-shrink-0" />
                      ) : (
                        <button onClick={() => onDeleteMov(m.id)} className="p-1 rounded hover:bg-black/5 flex-shrink-0" title="Excluir">
                          <Trash2 size={12} color={COLORS.inkSoft} />
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {showAddConta && <AddContaModal tipo={tipo} onClose={() => setShowAddConta(false)} onSave={onAddConta} />}
      {movDaConta && <AddMovimentacaoModal conta={movDaConta} onClose={() => setMovDaConta(null)} onSave={onAddMov} />}
    </div>
  );
}

function DespesasView({ despesas, onAdd, onEdit, onDelete, totalRecebidoNegocio, totalCustoNegocio, aReceberNegocio,
                         contas, movimentacoes, onAddConta, onDeleteConta, onAddMov, onDeleteMov,
                         pagamentosFatura, onPagarFatura, onDesfazerPagamento,
                         cartoes, comprasCartao, onAddCartao, onDeleteCartao, onAddCompra, onEditCompra, onDeleteCompra }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [filtro, setFiltro] = useState(null);

  const totalPorTipo = (key) => despesas.filter((d) => d.tipo === key).reduce((s, d) => s + (d.valor || 0), 0);
  const [subTab, setSubTab] = useState("contas");
  const [mesDetalhe, setMesDetalhe] = useState(null);
  const refMes = monthKey(todayStr());
  const totalCartaoEsteMes = cartoes.reduce((s, ct) => s + comprasCartao
    .filter((c) => c.cartaoId === ct.id)
    .reduce((s2, c) => { const p = parcelaInfo(c, refMes); return p ? s2 + c.valorParcela : s2; }, 0), 0);

  const totalAvulso = totalPorTipo("avulso");
  const totalFixa = totalPorTipo("fixa");
  const totalDespesas = totalCartaoEsteMes + totalAvulso + totalFixa;
  const contasPF = (contas || []).filter((c) => (c.tipo || "pf") === "pf");
  const totalEmContas = contasPF.reduce((s, c) => s + saldoDaConta(c, movimentacoes), 0);
  const sobra = totalEmContas + (aReceberNegocio || 0) - totalDespesas;

  const totalCartaoNoMes = (mk) => cartoes.reduce((s, ct) => s + comprasCartao
    .filter((c) => c.cartaoId === ct.id)
    .reduce((s2, c) => { const p = parcelaInfo(c, mk); return p ? s2 + c.valorParcela : s2; }, 0), 0);
  const mesesProjecao = [];
  for (let i = 0; i < 6; i++) mesesProjecao.push(addMonths(refMes, i));

  const sorted = [...despesas].sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  const visiveis = filtro ? sorted.filter((d) => d.tipo === filtro) : sorted;

  return (
    <div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <Card titulo="Total nas contas" valor={totalEmContas} cor={COLORS.burgundy} Icon={Landmark} />
        <Card titulo="A receber do negócio" valor={aReceberNegocio || 0} cor={COLORS.camelDeep} Icon={Hourglass} />
      </div>
      <div className="rounded-lg p-4 mb-4" style={{ backgroundColor: sobra >= 0 ? COLORS.green : COLORS.red }}>
        <div className="flex items-center gap-1.5 mb-1" style={{ color: "#fff" }}>
          <Wallet size={14} color="#fff" />
          <span className="text-xs font-medium">O que sobra (contas + a receber − despesas do mês)</span>
        </div>
        <div className="text-xl font-bold text-white" style={{ fontFamily: "ui-monospace, monospace" }}>{fmtMoney(sobra)}</div>
        <div className="text-[11px] mt-1" style={{ color: "rgba(255,255,255,0.85)" }}>
          Despesas do mês: {fmtMoney(totalDespesas)}
        </div>
      </div>

      <div className="mb-4">
        <div className="text-xs font-semibold mb-2" style={{ color: COLORS.inkSoft }}>Projeção de contas — próximos meses (cartões + fixas)</div>
        <div className="space-y-1.5">
          {mesesProjecao.map((m) => {
            const total = totalCartaoNoMes(m) + totalFixa;
            const aberto = mesDetalhe === m;
            const comprasDoMes = comprasCartao.filter((c) => parcelaInfo(c, m));
            const fixasDoMes = despesas.filter((d) => d.tipo === "fixa");
            return (
              <div key={m}>
                <button onClick={() => setMesDetalhe(aberto ? null : m)}
                        className="w-full flex items-center justify-between text-xs rounded-lg px-3 py-2"
                        style={{ backgroundColor: aberto ? COLORS.burgundy + "12" : "#F1F3F6" }}>
                  <span className="capitalize font-medium" style={{ color: COLORS.ink }}>{monthLabelShort(m)}</span>
                  <span className="font-bold" style={{ color: COLORS.ink, fontFamily: "ui-monospace, monospace" }}>{fmtMoney(total)}</span>
                </button>
                {aberto && (
                  <div className="mt-1 mb-2 pl-3 space-y-1">
                    {comprasDoMes.length === 0 && fixasDoMes.length === 0 && (
                      <p className="text-[11px]" style={{ color: COLORS.inkSoft }}>Nada previsto neste mês</p>
                    )}
                    {comprasDoMes.map((c) => {
                      const p = parcelaInfo(c, m);
                      const nomeCartao = (cartoes.find((ct) => ct.id === c.cartaoId) || {}).nome || "Cartão";
                      return (
                        <div key={c.id} className="flex items-center justify-between text-[11px] py-0.5">
                          <span style={{ color: COLORS.ink }}>
                            {nomeCartao}: {c.descricao}
                            {c.parcelas > 1 && <span style={{ color: COLORS.inkSoft }}> · parcela {p}/{c.parcelas}</span>}
                          </span>
                          <span className="font-semibold" style={{ color: COLORS.ink, fontFamily: "ui-monospace, monospace" }}>{fmtMoney(c.valorParcela)}</span>
                        </div>
                      );
                    })}
                    {fixasDoMes.map((d) => (
                      <div key={d.id} className="flex items-center justify-between text-[11px] py-0.5">
                        <span style={{ color: COLORS.ink }}>{d.titulo} <span style={{ color: COLORS.inkSoft }}>· conta fixa</span></span>
                        <span className="font-semibold" style={{ color: COLORS.ink, fontFamily: "ui-monospace, monospace" }}>{fmtMoney(d.valor)}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="flex gap-1 p-1 rounded-lg mb-4" style={{ backgroundColor: COLORS.burgundy }}>
        {[["contas", "Contas"], ["cartoes", "Cartões"], ["avulso", "Avulsos"], ["fixa", "Fixas"]].map(([key, label]) => (
          <button key={key} onClick={() => setSubTab(key)} className="flex-1 py-2 rounded-lg text-xs font-semibold"
                  style={{ backgroundColor: subTab === key ? "#fff" : "transparent",
                           color: subTab === key ? COLORS.burgundy : "rgba(255,255,255,0.75)" }}>
            {label}
          </button>
        ))}
      </div>

      {subTab === "contas" && (
        <ContasView contas={contasPF} movimentacoes={movimentacoes || []}
                    tipo="pf" titulo="Suas contas pessoais" tituloTotal="Total nas suas contas (PF)"
                    onAddConta={onAddConta} onDeleteConta={onDeleteConta}
                    onAddMov={onAddMov} onDeleteMov={onDeleteMov} />
      )}

      {subTab === "cartoes" && (
        <CartoesView cartoes={cartoes} compras={comprasCartao} onAddCartao={onAddCartao} onDeleteCartao={onDeleteCartao}
                     onAddCompra={onAddCompra} onEditCompra={onEditCompra} onDeleteCompra={onDeleteCompra}
                     contas={contas} pagamentosFatura={pagamentosFatura}
                     onPagarFatura={onPagarFatura} onDesfazerPagamento={onDesfazerPagamento} />
      )}

      {(subTab === "avulso" || subTab === "fixa") && (
        <div>
          <div className="flex items-center justify-between mb-4">
            <Card titulo={subTab === "avulso" ? "Total avulsos" : "Total fixas"} valor={subTab === "avulso" ? totalAvulso : totalFixa}
                  cor={tipoDespesaInfo(subTab).color} Icon={tipoDespesaInfo(subTab).icon} />
            <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium ml-3"
                    style={{ backgroundColor: COLORS.burgundy, color: "#fff" }}>
              <Plus size={16} color="#fff" /> Nova despesa
            </button>
          </div>

          {sorted.filter((d) => d.tipo === subTab).length === 0 && (
            <p className="text-sm py-6 text-center rounded-lg" style={{ color: COLORS.inkSoft, backgroundColor: "#F1F3F6" }}>Nenhuma despesa lançada aqui</p>
          )}
          <div className="space-y-2">
            {sorted.filter((d) => d.tipo === subTab).map((d) => {
              const info = tipoDespesaInfo(d.tipo);
              const Icon = info.icon;
              return (
                <div key={d.id} className="rounded-lg p-3 flex items-center gap-3" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
                  <div className="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style={{ backgroundColor: info.color + "1A" }}>
                    <Icon size={16} color={info.color} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold truncate" style={{ color: COLORS.ink }}>{d.titulo}</div>
                    <div className="text-xs" style={{ color: COLORS.inkSoft }}>{fmtDatePt(d.data)}{d.forma ? ` · ${d.forma}` : ""}</div>
                    {d.notas && <p className="text-xs mt-0.5" style={{ color: COLORS.inkSoft }}>{d.notas}</p>}
                  </div>
                  <div className="text-sm font-bold flex-shrink-0" style={{ color: COLORS.ink, fontFamily: "ui-monospace, monospace" }}>{fmtMoney(d.valor)}</div>
                  <button onClick={() => setEditingItem(d)} className="p-1.5 rounded-lg hover:bg-black/5 flex-shrink-0" title="Editar">
                    <PenLine size={13} color={COLORS.inkSoft} />
                  </button>
                  <button onClick={() => onDelete(d.id)} className="p-1.5 rounded-lg hover:bg-black/5 flex-shrink-0" title="Excluir">
                    <Trash2 size={14} color={COLORS.inkSoft} />
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showAdd && subTab === "avulso" && (
        <NovaDespesaModal cartoes={cartoes} onSaveAvulso={onAdd} onSaveCompra={onAddCompra} onClose={() => setShowAdd(false)} />
      )}
      {showAdd && subTab === "fixa" && (
        <AddDespesaModal tipoInicial="fixa" onClose={() => setShowAdd(false)} onSave={onAdd} />
      )}
      {editingItem && <EditDespesaModal item={editingItem} onClose={() => setEditingItem(null)} onSave={onEdit} />}
    </div>
  );
}

function VisaoGeralFinanceiro({ financeiro, despesas, contas, movimentacoes }) {
  const [refMes, setRefMes] = useState(monthKey(todayStr()));

  const recebidoDoMes = (mk) => financeiro
    .filter((f) => f.pago && monthKey(f.data) === mk)
    .reduce((s, f) => s + (f.valorPago || 0), 0);
  const custoDoMes = (mk) => financeiro
    .filter((f) => f.pago && monthKey(f.data) === mk)
    .reduce((s, f) => s + (f.custo || 0), 0);
  const gastosDoMes = (mk) => (despesas || [])
    .filter((d) => gastoNoMes(d, mk))
    .reduce((s, d) => s + (d.valor || 0), 0);
  const aReceberDoMes = (mk) => financeiro
    .filter((f) => !f.pago && monthKey(f.data) === mk)
    .reduce((s, f) => s + (f.valorPago || 0), 0);

  const recebido = recebidoDoMes(refMes);
  const custos = custoDoMes(refMes);
  const gastos = gastosDoMes(refMes);
  const saidas = custos + gastos;
  const aReceber = aReceberDoMes(refMes);
  const resultado = recebido - saidas;
  const margem = recebido > 0 ? Math.round((resultado / recebido) * 100) : null;

  const mesAnt = addMonths(refMes, -1);
  const labelAnt = monthLabelShort(mesAnt);
  const recebidoAnt = recebidoDoMes(mesAnt);
  const saidasAnt = custoDoMes(mesAnt) + gastosDoMes(mesAnt);
  const resultadoAnt = recebidoAnt - saidasAnt;

  // Últimos 6 meses até o mês selecionado
  const dadosGrafico = [];
  for (let i = 5; i >= 0; i--) {
    const m = addMonths(refMes, -i);
    dadosGrafico.push({
      mes: m,
      label: monthLabelShort(m).replace(/\.?\s*de\s+\d{4}/i, ""),
      entradas: recebidoDoMes(m),
      saidas: custoDoMes(m) + gastosDoMes(m),
    });
  }

  const fluxoNegocio = fluxoNegocioConta(financeiro, despesas);
  const totalPJ = (contas || []).filter((c) => c.tipo === "pj")
    .reduce((s, c) => s + saldoDaConta(c, movimentacoes || [], fluxoNegocio), 0);
  const totalPF = (contas || []).filter((c) => (c.tipo || "pf") === "pf")
    .reduce((s, c) => s + saldoDaConta(c, movimentacoes || []), 0);

  const Linha = ({ rotulo, valor, forte }) => (
    <div className="flex items-center justify-between py-1.5"
         style={{ borderTop: forte ? `1px solid ${COLORS.line}` : "none" }}>
      <span className="text-xs" style={{ color: forte ? COLORS.ink : COLORS.inkSoft, fontWeight: forte ? 600 : 400 }}>{rotulo}</span>
      <span className="text-xs font-semibold" style={{ color: forte ? COLORS.burgundy : COLORS.ink, fontFamily: "ui-monospace, monospace" }}>{fmtMoney(valor)}</span>
    </div>
  );

  return (
    <div>
      <div className="rounded-lg p-2 mb-3 flex items-center justify-between" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
        <button onClick={() => setRefMes((m) => addMonths(m, -1))} className="p-1.5 rounded-lg hover:bg-black/5" title="Mês anterior">
          <ChevronLeft size={18} color={COLORS.inkSoft} />
        </button>
        <div className="text-center leading-tight">
          <div className="text-[11px]" style={{ color: COLORS.inkSoft }}>Mês</div>
          <div className="text-sm font-semibold capitalize" style={{ color: COLORS.ink }}>{monthLabelShort(refMes)}</div>
          {refMes !== monthKey(todayStr()) && (
            <button onClick={() => setRefMes(monthKey(todayStr()))} className="text-[10px] underline" style={{ color: COLORS.inkSoft }}>voltar ao mês atual</button>
          )}
        </div>
        <button onClick={() => setRefMes((m) => addMonths(m, 1))} className="p-1.5 rounded-lg hover:bg-black/5" title="Próximo mês">
          <ChevronRight size={18} color={COLORS.inkSoft} />
        </button>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <Card titulo="Recebido" valor={recebido} cor={COLORS.green} Icon={TrendingUp}
              variacao={variacaoPct(recebido, recebidoAnt)} mesAnterior={labelAnt} sobeEhBom />
        <Card titulo="A receber" valor={aReceber} cor={COLORS.camelDeep} Icon={Hourglass} />
        <Card titulo="Saídas (custos + gastos)" valor={saidas} cor={COLORS.red} Icon={TrendingDown}
              variacao={variacaoPct(saidas, saidasAnt)} mesAnterior={labelAnt} sobeEhBom={false} />
        <Card titulo={margem != null ? `Resultado · margem ${margem}%` : "Resultado do mês"} valor={resultado}
              cor={COLORS.burgundy} Icon={Wallet} destaque
              variacao={variacaoPct(resultado, resultadoAnt)} mesAnterior={labelAnt} sobeEhBom />
      </div>

      <div className="mb-3">
        <GraficoEntradasSaidas dados={dadosGrafico} />
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-lg p-4" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
          <div className="text-sm font-semibold mb-2" style={{ color: COLORS.ink }}>Resultado do mês</div>
          <Linha rotulo="Recebido" valor={recebido} />
          <Linha rotulo="− Custos dos atendimentos" valor={custos} />
          <Linha rotulo="− Gastos da empresa" valor={gastos} />
          <Linha rotulo="Resultado" valor={resultado} forte />
        </div>
        <div className="rounded-lg p-4" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
          <div className="text-sm font-semibold mb-2" style={{ color: COLORS.ink }}>Saldo consolidado</div>
          <Linha rotulo="Contas da empresa (PJ)" valor={totalPJ} />
          <Linha rotulo="Contas pessoais (PF)" valor={totalPF} />
          <Linha rotulo="Total disponível" valor={totalPJ + totalPF} forte />
        </div>
      </div>
    </div>
  );
}

  const totalCusto = financeiro.reduce((s, f) => s + (f.custo || 0), 0);

                           color: subTab === key ? COLORS.burgundy : "rgba(255,255,255,0.75)" }}>

      {subTab === "negocio" && (

// ====== CLIENTES ======
function VencimentoBadge({ dataInicio, dataVencimento }) {
  const { dias } = proximoVencimento(dataInicio, dataVencimento);
  const urgente = dias <= 30;
  const cor = urgente ? COLORS.red : COLORS.green;
  const texto = dias < 0 ? `Atrasado ${Math.abs(dias)}d` : dias === 0 ? "Renova hoje" : `Renova em ${dias}d`;
  return (
    <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold" style={{ backgroundColor: cor + "1A", color: cor }}>
      {texto}
    </span>
  );
}

function ClienteForm({ item, categoriaFixa, onSubmit, submitLabel }) {
  const [nome, setNome] = useState(item ? item.nome : "");
  const [categoria, setCategoria] = useState(item ? item.categoria : (categoriaFixa || "seguro"));
  const [subtipo, setSubtipo] = useState(item ? item.subtipo : SUBTIPOS[categoriaFixa || "seguro"][0].key);
  const [dataInicio, setDataInicio] = useState(item ? item.dataInicio : todayStr());
  const [dataVencimento, setDataVencimento] = useState(item && item.dataVencimento ? item.dataVencimento : "");
  const [notas, setNotas] = useState(item ? item.notas : "");
  const [telefone, setTelefoneInput] = useState(item ? getTelefone(item.nome) : "");

  const submit = () => {
    if (!nome.trim()) return;
    setTelefone(nome.trim(), normalizarTelefone(telefone));
    onSubmit({ nome: nome.trim(), categoria, subtipo, dataInicio, dataVencimento, notas: notas.trim() });
  };

  // Prévia da data que será usada
  const prev = proximoVencimento(dataInicio, dataVencimento);
  const prevStr = prev.venc.toISOString().slice(0, 10);

  return (
    <React.Fragment>
      <Field label="Cliente">
        <input style={inputStyle} value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome do cliente" autoFocus />
      </Field>
      <Field label="WhatsApp (com DDD)">
        <input style={inputStyle} value={telefone} onChange={(e) => setTelefoneInput(e.target.value)} placeholder="Ex: 11 91234-5678" inputMode="tel" />
      </Field>
      <CategoriaSubtipoPicker categoria={categoria} setCategoria={setCategoria} subtipo={subtipo} setSubtipo={setSubtipo} />
      <Field label="Data de início (venda / emissão)">
        <input type="date" style={inputStyle} value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} />
      </Field>
      <Field label="Data de vencimento (opcional)">
        <input type="date" style={inputStyle} value={dataVencimento} onChange={(e) => setDataVencimento(e.target.value)} />
      </Field>
      <p className="text-[11px] mb-3" style={{ color: COLORS.inkSoft }}>
        {dataVencimento
          ? `Vencimento definido para ${fmtDatePt(dataVencimento)}. Aviso 30 dias antes.`
          : `Deixe em branco para calcular automaticamente 1 ano após o início (${fmtDatePt(prevStr)}). Preencha para clientes que já estão perto de vencer.`}
      </p>
      <Field label="Observações">
        <textarea style={{ ...inputStyle, minHeight: 50, resize: "vertical" }} value={notas} onChange={(e) => setNotas(e.target.value)} />
      </Field>
      <PrimaryButton onClick={submit}>{submitLabel}</PrimaryButton>
    </React.Fragment>
  );
}

function AddClienteModal({ categoriaFixa, onClose, onSave }) {

function ProximosVencimentos({ clientes }) {
  const proximos = clientes
    .map((c) => ({ ...c, ...proximoVencimento(c.dataInicio, c.dataVencimento) }))
    .filter((c) => c.dias <= 30)
    .sort((a, b) => a.dias - b.dias);

  if (proximos.length === 0) return null;

  const certificados = proximos.filter((c) => c.categoria === "certificado");
  const seguros = proximos.filter((c) => c.categoria === "seguro");

  return (
    <div className="rounded-lg p-4 mb-4" style={{ backgroundColor: "#FBEAEA", border: `1px solid ${COLORS.red}33` }}>
      <div className="flex items-center gap-1.5 mb-2">
        <Bell size={14} color={COLORS.red} />
        <span className="text-xs font-semibold" style={{ color: COLORS.red }}>Próximos vencimentos (30 dias)</span>
      </div>
      {seguros.length > 0 && (
        <div className="mb-2">
          <div className="text-[10px] font-semibold uppercase tracking-wide mb-1" style={{ color: COLORS.burgundy }}>Seguros</div>
          {seguros.map((c) => (
            <div key={c.id} className="flex items-center justify-between text-xs py-0.5">
              <span style={{ color: COLORS.ink }}>{c.nome}</span>
              <span className="text-right">
                <span className="font-semibold" style={{ color: COLORS.red }}>{c.dias < 0 ? `Atrasado ${Math.abs(c.dias)}d` : c.dias === 0 ? "Hoje" : `${c.dias}d`}</span>
                <span style={{ color: COLORS.inkSoft }}> · {fmtDatePt(c.venc.toISOString().slice(0, 10))}</span>
              </span>
            </div>
          ))}
        </div>
      )}
      {certificados.length > 0 && (
        <div>
          <div className="text-[10px] font-semibold uppercase tracking-wide mb-1" style={{ color: COLORS.skyBlue }}>Certificação Digital</div>
          {certificados.map((c) => (
            <div key={c.id} className="flex items-center justify-between text-xs py-0.5">
              <span style={{ color: COLORS.ink }}>{c.nome}</span>
              <span className="text-right">
                <span className="font-semibold" style={{ color: COLORS.red }}>{c.dias < 0 ? `Atrasado ${Math.abs(c.dias)}d` : c.dias === 0 ? "Hoje" : `${c.dias}d`}</span>
                <span style={{ color: COLORS.inkSoft }}> · {fmtDatePt(c.venc.toISOString().slice(0, 10))}</span>
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      contas, movimentacoes,

    { titulo: "Seguradora", valor: (a) => a.seguradora },
    { titulo: "Valor", valor: (a) => (a.valor != null ? a.valor.toFixed(2).replace(".", ",") : "") },
    { titulo: "Comissão (%)", valor: (a) => (a.comissao != null ? a.comissao : "") },
    { titulo: "Situação", valor: (a) => a.pagamento },
    { titulo: "Etapa", valor: (a) => statusLabel(a.categoria, statusDoItem(a)) },
    { titulo: "Solicitado em", valor: (a) => fmtDatePt(a.dataSolicitacao || (a.criadoEm || "").slice(0, 10)) },
    { titulo: "Agendamento", valor: (a) => fmtDatePt(a.dataAgendamento) },
    { titulo: "Observações", valor: (a) => a.notas },
  ]), "text/csv");

  const csvDespesas = () => baixarArquivo(`despesas-${carimboData()}.csv`, paraCSV(despesas, [
    { titulo: "Título", valor: (d) => d.titulo },
    { titulo: "Tipo", valor: (d) => ({ avulso: "Gasto avulso (pessoal)", fixa: "Conta fixa (pessoal)",
                                        negocio_avulso: "Gasto avulso (empresa)", negocio_fixa: "Conta fixa (empresa)" }[d.tipo] || d.tipo) },
    { titulo: "Valor", valor: (d) => (d.valor || 0).toFixed(2).replace(".", ",") },

    { titulo: "Observações", valor: (d) => d.notas },
  ]), "text/csv");

  const csvCompras = () => baixarArquivo(`compras-cartao-${carimboData()}.csv`, paraCSV(comprasCartao, [
    { titulo: "Cartão", valor: (c) => ((cartoes.find((ct) => ct.id === c.cartaoId) || {}).nome || "") },

        <button onClick={baixarJSON} className="w-full py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-2"

      </div>

      <div className="text-xs font-semibold mb-2" style={{ color: COLORS.inkSoft }}>Planilhas para abrir no Excel</div>
      <div className="space-y-1.5">
        {linhas.map(([titulo, qtd, acao]) => (

            </button>

        ))}

      <p className="text-[11px] mt-3" style={{ color: COLORS.inkSoft }}>
        Dica: baixe o backup completo uma vez por semana e guarde numa pasta segura (ou no seu e-mail).
      </p>
    </Modal>
  );
}

function TelaLogin({ onEntrar }) {
  const [usuario, setUsuario] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  const entrar = async () => {
    if (!usuario.trim() || !senha) { setErro("Preencha usuário e senha."); return; }
    setCarregando(true); setErro("");
    try {
      await apiLogin(usuario.trim(), senha);
      onEntrar();
    } catch (e) {
      setErro(e.message === "Failed to fetch"
        ? "Servidor iniciando, aguarde um instante e tente de novo."
        : (e.message || "Não foi possível entrar."));
    } finally {
      setCarregando(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4"
         style={{ backgroundColor: COLORS.bg,
                  backgroundImage: `linear-gradient(rgba(244,246,249,0.92), rgba(244,246,249,0.92)), url(${WATERMARK_B64})`,
                  backgroundRepeat: "no-repeat",
                  backgroundPosition: "center center", backgroundSize: "auto, 80vmin 80vmin" }}>
      <div className="w-full max-w-sm rounded-lg overflow-hidden" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}`, boxShadow: "0 4px 20px rgba(16,27,51,0.10)" }}>
        <div className="flex flex-col items-center py-6 px-6" style={{ backgroundColor: COLORS.burgundy }}>
          <img src={LOGO_B64} alt="Inove" className="w-14 h-14 rounded-full mb-3" style={{ boxShadow: "0 0 0 1px rgba(255,255,255,0.18)" }} />
          <h1 className="text-xl text-white" style={{ fontWeight: 600, letterSpacing: "1.8px" }}>INOVE</h1>
          <p className="text-[10px] mt-0.5" style={{ color: "#9FB0CC", letterSpacing: "0.5px" }}>PAINEL DE GESTÃO</p>
        </div>
        <div className="p-6">
        <form onSubmit={(e) => { e.preventDefault(); entrar(); }}>
        <Field label="Usuário">
          <input name="username" autoComplete="username" style={inputStyle} value={usuario} onChange={(e) => setUsuario(e.target.value)}
                 placeholder="Seu usuário" autoFocus />
        </Field>
        <Field label="Senha">
          <input type="password" name="password" autoComplete="current-password" style={inputStyle} value={senha} onChange={(e) => setSenha(e.target.value)}
                 placeholder="Sua senha" />
        </Field>
        {erro && <p className="text-xs mb-3" style={{ color: COLORS.red }}>{erro}</p>}
        <button type="submit" className="w-full py-3 rounded-lg font-medium text-sm" style={{ backgroundColor: COLORS.burgundy, color: "#fff" }}>
          {carregando ? "Entrando..." : "Entrar"}
        </button>
        </form>
        </div>
      </div>
    </div>
  );
}
