  const [despesas, setDespesas] = useState([]);
  const [cartoes, setCartoes] = useState([]);
  const [comprasCartao, setComprasCartao] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [contas, setContas] = useState([]);
  const [movimentacoes, setMovimentacoes] = useState([]);
  const [pagamentosFatura, setPagamentosFatura] = useState([]);
  const [mesKanban, setMesKanban] = useState(monthKey(todayStr()));
  const [showBackup, setShowBackup] = useState(false);

  // Recupera os certificados que já estavam como "Emitido" antes da correção e ficaram
  // sem cliente na Gestão de Clientes. Roda uma vez só e nunca duplica.
  const sincronizarClientesEmitidos = async (ats, cls) => {
    try { if (localStorage.getItem("clientesEmitidosSincronizados") === "1") return; } catch (e) {}
    const faltando = ats.filter((a) =>
      a.categoria === "certificado" &&
      concluiuVenda(a.categoria, a.status) &&
      !cls.some((c) => c.atendimentoId === a.id)
    );
    if (faltando.length === 0) {
      try { localStorage.setItem("clientesEmitidosSincronizados", "1"); } catch (e) {}
      return;
    }
    // Sem a data exata da emissão, usa a melhor referência que existe no atendimento
    const novos = faltando.map((a) => ({
      id: uid(), nome: a.cliente, categoria: a.categoria, subtipo: a.subtipo,
      dataInicio: a.dataAgendamento || a.dataSolicitacao || (a.criadoEm || "").slice(0, 10) || todayStr(),
      notas: "", atendimentoId: a.id,
    }));
    try {
      for (const nc of novos) await apiPost("/api/clientes", nc);
      setClientes((prev) => [...prev, ...novos]);
      localStorage.setItem("clientesEmitidosSincronizados", "1");
    } catch (e) { console.error(e); }
  };

  const carregarTudo = async () => {
    setLoading(true); setErro("");
    try {
      const [a, ag, f, d, ct, cc, cl, cn, mv, pf] = await Promise.all([
        apiGet("/api/atendimentos"), apiGet("/api/agendamentos"), apiGet("/api/financeiro"),
        apiGet("/api/despesas").catch(() => []),
        apiGet("/api/cartoes").catch(() => []),
        apiGet("/api/compras-cartao").catch(() => []),
        apiGet("/api/clientes").catch(() => []),
        apiGet("/api/contas").catch(() => []),
        apiGet("/api/movimentacoes").catch(() => []),
        apiGet("/api/pagamentos-fatura").catch(() => []),
      ]);
      const ats = a.map(mapAtendimento);
      const cls = cl.map(mapCliente);
      setAtendimentos(ats);
      setAgendamentos(ag.map(mapAgendamento));
      setFinanceiro(f.map(mapFinanceiro));
      setDespesas(d.map(mapDespesa));
      setCartoes(ct.map(mapCartao));
      setComprasCartao(cc.map(mapCompraCartao));
      setClientes(cls);
      setContas(cn.map(mapConta));
      setMovimentacoes(mv.map(mapMovimentacao));
      setPagamentosFatura(pf.map(mapPagamentoFatura));
      await sincronizarClientesEmitidos(ats, cls);
    } catch (e) {
      console.error(e);
      setErro("Não foi possível conectar ao servidor. Ele pode estar 'acordando' — aguarde até 1 minuto e tente de novo.");
    } finally { setLoading(false); }
  };

  useEffect(() => {
    onSessaoExpirada = () => { setLogado(false); };
    return () => { onSessaoExpirada = null; };
  }, []);

  useEffect(() => {
    if (logado) carregarTudo();
  }, [logado]);

  // Verifica a sessão periodicamente; se expirou, volta para o login
  useEffect(() => {
    if (!logado) return;
    const iv = setInterval(async () => {
      try { await apiGet("/api/verificar"); }
      catch (e) { /* o próprio tratar401 já dispara o logout */ }
    }, 60 * 1000);
    return () => clearInterval(iv);
  }, [logado]);

  const addAtendimento = async (item) => {
    setAtendimentos((prev) => [item, ...prev]);
    try {
      await apiPost("/api/atendimentos", item);
      if (item.dataAgendamento && item.horarioAgendamento) {
        const ag = { id: uid(), cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
                     data: item.dataAgendamento, horario: item.horarioAgendamento, notas: item.notas, atendimentoId: item.id };
        setAgendamentos((prev) => [...prev, ag]);
        await apiPost("/api/agendamentos", ag);
      }
      // Seguro: a comissão vira N parcelas (uma por mês). Certificado: valor cheio, uma vez.
      const aindaSolicitado = item.categoria === "certificado" && item.status === "solicitado";
      if (item.categoria === "seguro" && (item.valorComissao || 0) > 0) {
        const lancs = montarLancamentosComissao(item);
        setFinanceiro((prev) => [...lancs, ...prev]);
        for (const l of lancs) await apiPost("/api/financeiro", l);
      } else if (item.categoria === "certificado" && (item.valor || 0) > 0 && !aindaSolicitado) {
        const lanc = { id: uid(), cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
                       valorPago: item.valor, custo: item.custo || 0, forma: item.forma || "",
                       data: item.dataAgendamento || todayStr(), pago: item.pagamento !== "pendente",
                       atendimentoId: item.id };
        setFinanceiro((prev) => [lanc, ...prev]);
        await apiPost("/api/financeiro", lanc);
      }
    } catch (e) { console.error(e); setErro("Não foi possível salvar o atendimento no servidor."); }
  };
  const editAtendimento = async (item) => {
    setAtendimentos((prev) => prev.map((a) => (a.id === item.id ? item : a)));
    try {
      await apiPatch(`/api/atendimentos/${item.id}`, item);

      // Sincroniza o agendamento vinculado (cria se não existir, atualiza se já existir)
      if (item.dataAgendamento && item.horarioAgendamento) {
        const existente = agendamentos.find((a) => a.atendimentoId === item.id);
        const dadosAg = { cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
                          data: item.dataAgendamento, horario: item.horarioAgendamento, notas: item.notas };
        if (existente) {
          setAgendamentos((prev) => prev.map((a) => (a.id === existente.id ? { ...a, ...dadosAg } : a)));
          await apiPatch(`/api/agendamentos/${existente.id}`, dadosAg);
        } else {
          const novo = { id: uid(), ...dadosAg, atendimentoId: item.id };
          setAgendamentos((prev) => [...prev, novo]);
          await apiPost("/api/agendamentos", novo);
        }
      }

      // Sincroniza o lançamento financeiro vinculado
      if (item.categoria === "seguro" && (item.valorComissao || 0) > 0) {
        const existentes = financeiro.filter((f) => f.atendimentoId === item.id);
        // Se alguma parcela já foi recebida, não recria (evita perder o recebimento)
        if (!existentes.some((f) => f.pago)) {
          for (const f of existentes) await apiDelete(`/api/financeiro/${f.id}`);
          const lancs = montarLancamentosComissao(item);
          setFinanceiro((prev) => [...lancs, ...prev.filter((f) => f.atendimentoId !== item.id)]);
          for (const l of lancs) await apiPost("/api/financeiro", l);
        }
      } else if (item.categoria === "certificado" && (item.valor || 0) > 0) {
        const existenteF = financeiro.find((f) => f.atendimentoId === item.id);
        const dadosF = { cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
                         valorPago: item.valor, custo: item.custo || 0, forma: item.forma || "",
                         data: item.dataAgendamento || (existenteF ? existenteF.data : todayStr()),
                         pago: item.pagamento !== "pendente" };
        const soSolicitado = item.status === "solicitado";
        if (existenteF) {
          setFinanceiro((prev) => prev.map((f) => (f.id === existenteF.id ? { ...f, ...dadosF } : f)));
          await apiPatch(`/api/financeiro/${existenteF.id}`, dadosF);
        } else if (!soSolicitado) {
          const novoF = { id: uid(), ...dadosF, atendimentoId: item.id };
          setFinanceiro((prev) => [novoF, ...prev]);
          await apiPost("/api/financeiro", novoF);
        }
      }
    } catch (e) { console.error(e); setErro("Não foi possível salvar as alterações."); }
  };
  const moveAtendimento = async (id, status) => {
    setAtendimentos((prev) => prev.map((a) => (a.id === id ? { ...a, status } : a)));
    try {
      await apiPatch(`/api/atendimentos/${id}`, { status });
      const item = atendimentos.find((a) => a.id === id);

      // Certificado: o valor só entra no financeiro quando sai de "Solicitado"
      if (item && item.categoria === "certificado") {
        const lanc = financeiro.find((f) => f.atendimentoId === id);
        if (status === "solicitado") {
          // Voltou para solicitado: desfaz o lançamento, a menos que já tenha sido recebido
          if (lanc && !lanc.pago) {
            setFinanceiro((prev) => prev.filter((f) => f.id !== lanc.id));
            await apiDelete(`/api/financeiro/${lanc.id}`);
          }
        } else if (!lanc && item.valor > 0) {
          const novoLanc = {
            id: uid(), cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
            valorPago: item.valor, custo: item.custo || 0, forma: item.forma || "",
            data: item.dataAgendamento || todayStr(), pago: item.pagamento !== "pendente",
            atendimentoId: id,
          };
          setFinanceiro((prev) => [novoLanc, ...prev]);
          await apiPost("/api/financeiro", novoLanc);
        }
      }

      if (item && concluiuVenda(item.categoria, status)) {
        const jaTemCliente = clientes.some((c) => c.atendimentoId === id);
        if (!jaTemCliente) {
          const novoCliente = {
            id: uid(), nome: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
            dataInicio: todayStr(), notas: "", atendimentoId: id,
          };
          setClientes((prev) => [...prev, novoCliente]);
          await apiPost("/api/clientes", novoCliente);
        }
      }
    }
    catch (e) { console.error(e); setErro("Não foi possível atualizar o status."); }
  };
  const deleteAtendimento = async (id) => {
    setAtendimentos((prev) => prev.filter((a) => a.id !== id));
    try { await apiDelete(`/api/atendimentos/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir."); }
  };
  const addAgendamento = async (item) => {
    setAgendamentos((prev) => [...prev, item]);
    try { await apiPost("/api/agendamentos", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar o agendamento."); }
  };
  const deleteAgendamento = async (id) => {
    setAgendamentos((prev) => prev.filter((a) => a.id !== id));
    try { await apiDelete(`/api/agendamentos/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir."); }
  };
  const addFinanceiro = async (item) => {
    setFinanceiro((prev) => [item, ...prev]);
    try { await apiPost("/api/financeiro", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar o lançamento."); }
  };
  const deleteFinanceiro = async (id) => {
    setFinanceiro((prev) => prev.filter((f) => f.id !== id));
    try { await apiDelete(`/api/financeiro/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir."); }
  };
  const marcarPago = async (id) => {
    const hoje = todayStr();
    setFinanceiro((prev) => prev.map((f) => (f.id === id ? { ...f, pago: true, data: hoje } : f)));
    try { await apiPatch(`/api/financeiro/${id}`, { pago: true, data: hoje }); }
    catch (e) { console.error(e); setErro("Não foi possível atualizar o pagamento."); }
  };
  const editFinanceiro = async (item) => {
    setFinanceiro((prev) => prev.map((f) => (f.id === item.id ? item : f)));
    try { await apiPatch(`/api/financeiro/${item.id}`, item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar as alterações."); }
  };
  const addDespesa = async (item) => {
    setDespesas((prev) => [item, ...prev]);
    try { await apiPost("/api/despesas", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar a despesa."); }
  };
  const editDespesa = async (item) => {
    setDespesas((prev) => prev.map((d) => (d.id === item.id ? item : d)));
    try { await apiPatch(`/api/despesas/${item.id}`, item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar as alterações."); }
  };
  const deleteDespesa = async (id) => {
    setDespesas((prev) => prev.filter((d) => d.id !== id));
    try { await apiDelete(`/api/despesas/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir a despesa."); }
  };
  const addCartao = async (item) => {
    setCartoes((prev) => [...prev, item]);
    try { await apiPost("/api/cartoes", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar o cartão."); }
  };
  const deleteCartao = async (id) => {
    setCartoes((prev) => prev.filter((c) => c.id !== id));
    setComprasCartao((prev) => prev.filter((c) => c.cartaoId !== id));
    try { await apiDelete(`/api/cartoes/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir o cartão."); }
  };
  const addCompra = async (item) => {
    setComprasCartao((prev) => [item, ...prev]);
    try { await apiPost("/api/compras-cartao", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar a compra."); }
  };
  const editCompra = async (item) => {
    setComprasCartao((prev) => prev.map((c) => (c.id === item.id ? item : c)));
    try { await apiPatch(`/api/compras-cartao/${item.id}`, item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar as alterações."); }
  };
  const deleteCompra = async (id) => {
    setComprasCartao((prev) => prev.filter((c) => c.id !== id));
    try { await apiDelete(`/api/compras-cartao/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir a compra."); }
  };
  const addCliente = async (item) => {
    setClientes((prev) => [...prev, item]);
    try { await apiPost("/api/clientes", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar o cliente."); }
  };
  const editCliente = async (item) => {
    setClientes((prev) => prev.map((c) => (c.id === item.id ? item : c)));
    try { await apiPatch(`/api/clientes/${item.id}`, item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar as alterações."); }
  };
  const deleteCliente = async (id) => {
    setClientes((prev) => prev.filter((c) => c.id !== id));
    try { await apiDelete(`/api/clientes/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir o cliente."); }
  };
  const addConta = async (item) => {
    setContas((prev) => [...prev, item]);
    try { await apiPost("/api/contas", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar a conta."); }
  };
  const deleteConta = async (id) => {
    setContas((prev) => prev.filter((c) => c.id !== id));
    setMovimentacoes((prev) => prev.filter((m) => m.contaId !== id));
    try { await apiDelete(`/api/contas/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir a conta."); }
  };
  // Define (ou tira) a conta do negócio. Só uma pode ser principal por vez.
  const definirContaPrincipal = async (id) => {
    const anteriores = contas.filter((c) => c.principal && c.id !== id);
    setContas((prev) => prev.map((c) => ({ ...c, principal: c.id === id })));
    try {
      for (const c of anteriores) await apiPatch(`/api/contas/${c.id}`, { principal: false });
      if (id) await apiPatch(`/api/contas/${id}`, { principal: true });
    } catch (e) { console.error(e); setErro("Não foi possível definir a conta do negócio."); }
  };
  const addMovimentacao = async (item) => {
    setMovimentacoes((prev) => [item, ...prev]);
    try { await apiPost("/api/movimentacoes", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar a movimentação."); }
  };
  // Pagar a fatura: lança a saída na conta escolhida e marca a fatura do mês como paga
  const pagarFatura = async (cartao, mes, dados) => {
    const mov = {
      id: uid(), contaId: dados.contaId, tipo: "saida", valor: dados.valor,
      descricao: `Fatura ${cartao.nome} · ${monthLabelShort(mes)}`, data: dados.data,
    };
    const pag = {
      id: uid(), cartaoId: cartao.id, contaId: dados.contaId, mes,
      valor: dados.valor, data: dados.data, movimentacaoId: mov.id,
    };
    setMovimentacoes((prev) => [mov, ...prev]);
    setPagamentosFatura((prev) => [pag, ...prev]);
    try {
      await apiPost("/api/movimentacoes", mov);
      await apiPost("/api/pagamentos-fatura", pag);
    } catch (e) { console.error(e); setErro("Não foi possível registrar o pagamento da fatura."); }
  };
  const desfazerPagamentoFatura = async (pag) => {
    setPagamentosFatura((prev) => prev.filter((p) => p.id !== pag.id));
    if (pag.movimentacaoId) setMovimentacoes((prev) => prev.filter((m) => m.id !== pag.movimentacaoId));
    try {
      await apiDelete(`/api/pagamentos-fatura/${pag.id}`);
      if (pag.movimentacaoId) await apiDelete(`/api/movimentacoes/${pag.movimentacaoId}`);
    } catch (e) { console.error(e); setErro("Não foi possível desfazer o pagamento."); }
  };
  const deleteMovimentacao = async (id) => {
    setMovimentacoes((prev) => prev.filter((m) => m.id !== id));
    try { await apiDelete(`/api/movimentacoes/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir a movimentação."); }
  };

  const tabs = [
    { key: "kanban", label: "Atendimentos", icon: LayoutGrid },
    { key: "calendario", label: "Calendário", icon: CalendarIcon },
    { key: "financeiro", label: "Financeiro", icon: Wallet },
    { key: "clientes", label: "Clientes", icon: Users },
  ];

  if (!logado) {
    return <TelaLogin onEntrar={() => setLogado(true)} />;
  }

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: COLORS.bg }}>
        <span className="text-sm" style={{ color: COLORS.inkSoft }}>Conectando ao servidor...</span>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{
      backgroundColor: COLORS.bg,
      backgroundImage: `linear-gradient(rgba(244,246,249,0.90), rgba(244,246,249,0.90)), url(${WATERMARK_B64})`,
      backgroundRepeat: "no-repeat",
      backgroundPosition: "center center",
      backgroundSize: "auto, 85vmin 85vmin",
      backgroundAttachment: "fixed",
    }}>
      <div className="sticky top-0 z-10">
        <div className="px-4 py-3" style={{ backgroundColor: COLORS.burgundy }}>
          <div className="flex items-center gap-3">
            <img src={LOGO_B64} alt="Inove" className="w-9 h-9 rounded-full flex-shrink-0" style={{ boxShadow: "0 0 0 1px rgba(255,255,255,0.18)" }} />
            <div className="min-w-0">
              <h1 className="text-lg leading-tight text-white" style={{ fontWeight: 600, letterSpacing: "1.6px" }}>INOVE</h1>
              <p className="text-[10px] leading-tight" style={{ color: "#9FB0CC", letterSpacing: "0.4px" }}>SEGUROS E SOLUÇÕES FINANCEIRAS · CERTIFICAÇÃO DIGITAL</p>
            </div>
            <div className="ml-auto flex items-center gap-1.5 flex-shrink-0">
              <button onClick={() => setShowBackup(true)} className="p-2 rounded-md hover:bg-white/10" title="Backup dos dados">
                <Download size={16} color="#9FB0CC" />
              </button>
              <button onClick={carregarTudo} className="p-2 rounded-md hover:bg-white/10" title="Atualizar">
                <RefreshCw size={16} color="#9FB0CC" />
              </button>
              <button onClick={() => { SESSION_TOKEN = null; setLogado(false); }} className="p-2 rounded-md hover:bg-white/10" title="Sair">
                <LogOut size={16} color="#9FB0CC" />
              </button>
              <div className="flex flex-col items-end ml-1">
                <div className="flex items-center gap-1 px-1.5 py-1 rounded-md" style={{ border: "1px solid rgba(255,255,255,0.22)" }}>
                  <button onClick={() => setMesKanban(addMonths(mesKanban, -1))} className="p-0.5 rounded hover:bg-white/10">
                    <ChevronLeft size={15} color="#fff" />
                  </button>
                  <span className="text-xs font-semibold text-white capitalize" style={{ minWidth: 104, textAlign: "center" }}>{monthLabelLong(mesKanban)}</span>
                  <button onClick={() => setMesKanban(addMonths(mesKanban, 1))} className="p-0.5 rounded hover:bg-white/10">
                    <ChevronRight size={15} color="#fff" />
                  </button>
                </div>
                <span className="text-[10px] capitalize mt-1" style={{ color: "#9FB0CC" }}>{hojeExtenso()}</span>
              </div>
            </div>
          </div>
        </div>

        <div className="flex px-4" style={{ backgroundColor: "#fff", borderBottom: `1px solid ${COLORS.line}` }}>
          {tabs.map((t) => {
            const Icon = t.icon;
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)}
                      className="flex-1 flex items-center justify-center gap-1.5 py-2.5 text-xs"
                      style={{ color: active ? COLORS.burgundy : COLORS.inkSoft,
                               fontWeight: active ? 600 : 500,
                               borderBottom: active ? `2px solid ${COLORS.camel}` : "2px solid transparent",
                               marginBottom: "-1px" }}>
                <Icon size={15} color={active ? COLORS.burgundy : COLORS.inkSoft} />
                {t.label}
              </button>
            );
          })}
        </div>
      </div>

      <div className="px-4 pt-5 pb-10">
        {erro && (
          <div className="rounded-lg p-3 mb-4 text-xs flex items-center justify-between gap-2"
               style={{ backgroundColor: "#FBEAEA", color: COLORS.red }}>
            <span>{erro}</span>
            <button onClick={carregarTudo} className="font-semibold underline flex-shrink-0">Tentar de novo</button>
          </div>
        )}
        {tab === "kanban" && <KanbanBoard atendimentos={atendimentos} onAdd={addAtendimento} onMove={moveAtendimento} onDelete={deleteAtendimento} onEdit={editAtendimento} clientes={clientes} mesKanban={mesKanban} financeiro={financeiro} />}
        {tab === "calendario" && <CalendarView agendamentos={agendamentos} onAdd={addAgendamento} onDelete={deleteAgendamento} />}
        {tab === "financeiro" && (
          <FinanceView
            financeiro={financeiro} onAddFinanceiro={addFinanceiro} onEditFinanceiro={editFinanceiro}
            onDeleteFinanceiro={deleteFinanceiro} onMarcarPago={marcarPago}
            despesas={despesas} onAddDespesa={addDespesa} onEditDespesa={editDespesa} onDeleteDespesa={deleteDespesa}
            contas={contas} movimentacoes={movimentacoes} onAddConta={addConta} onDeleteConta={deleteConta}
            onAddMov={addMovimentacao} onDeleteMov={deleteMovimentacao} onSetPrincipal={definirContaPrincipal}
            pagamentosFatura={pagamentosFatura} onPagarFatura={pagarFatura} onDesfazerPagamento={desfazerPagamentoFatura}
            cartoes={cartoes} comprasCartao={comprasCartao} onAddCartao={addCartao} onDeleteCartao={deleteCartao}
            onAddCompra={addCompra} onEditCompra={editCompra} onDeleteCompra={deleteCompra}
          />
        )}
        {tab === "clientes" && (
          <ClientesView clientes={clientes} onAdd={addCliente} onEdit={editCliente} onDelete={deleteCliente} />
        )}
      </div>

      {showBackup && (
        <BackupModal
          dados={{ atendimentos, agendamentos, financeiro, despesas, cartoes, comprasCartao, clientes, contas, movimentacoes }}
          onClose={() => setShowBackup(false)}
        />
      )}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  const box = document.getElementById("erro-fatal");
  box.style.display = "block";
  box.textContent = "Erro ao carregar o painel:\n" + e.message;
}
</script>
</body>
</html>
